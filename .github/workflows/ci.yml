name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpdoctor
          path: dcpdoctor
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev ffmpeg

      - name: Build dcpdoctor
        working-directory: dcpdoctor/rust
        run: cargo build --release --locked

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Create synthetic fixtures
        run: ./scripts/create_synthetic.sh

      # generate.sh needs a source with video and audio so dcpwizard emits both MXFs
      - name: Generate DCP fixtures
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=2048x1080:rate=24:duration=3 \
                 -f lavfi -i sine=frequency=1000:sample_rate=48000:duration=3 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/ctp-source.mp4
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          SOURCE_VIDEO=/tmp/ctp-source.mp4 ./scripts/generate.sh

      # Runs every category. The isdcf cases skip since the 2GB content isn't downloaded.
      - name: Test packages
        run: |
          DCPDOCTOR="$PWD/dcpdoctor/rust/target/release/dcpdoctor"
          ./scripts/run_tests.sh --dcpdoctor "$DCPDOCTOR"

      # Per-error-code negative corpus: one real mutated fixture per code, each
      # asserting its code fires and is absent on the valid baseline. ClairMeta
      # reference packages aren't fetched here (~1.5GB), so those checks skip.
      - name: Build per-code corpus
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/build_corpus.sh

      - name: Run per-code corpus assertions
        run: |
          DCPDOCTOR="$PWD/dcpdoctor/rust/target/release/dcpdoctor" \
          python3 ./scripts/run_corpus.py

  # Optional crypto job: prove dcpwizard's encryption + KDM chain end to end.
  # Encrypt a DCP, build a KDM for a recipient we control, independently
  # RSA-unwrap the content key from the KDM (openssl) and decrypt the essence
  # (asdcplib-rs). Independent of core CI; a break here fails only this job.
  encryption:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev ffmpeg cmake

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Verify encryption + KDM chain
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/verify_encryption.sh

  # Optional differential job: diff dcpdoctor against ClairMeta over the corpus.
  # Informational, never blocks core CI (uploads report.json + report.md). The
  # ClairMeta ECL packages (~1.5GB) aren't fetched here, so only baselines +
  # fixtures run; asdcplib is absent so ClairMeta's MXF-essence checks bypass.
  # Photon/IMF isn't run: the corpus has no IMF packages.
  differential:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpdoctor
          path: dcpdoctor
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libssl-dev libxerces-c-dev ffmpeg
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build dcpdoctor
        working-directory: dcpdoctor/rust
        run: cargo build --release --locked

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Build per-code corpus
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/build_corpus.sh

      - name: Run differential harness
        working-directory: diff
        run: |
          DCPDOCTOR="$GITHUB_WORKSPACE/dcpdoctor/rust/target/release/dcpdoctor" \
          uv run differential.py

      - uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            diff/report.json
            diff/report.md
