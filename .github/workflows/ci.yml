name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpdoctor
          path: dcpdoctor
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxml2-utils libssl-dev libxerces-c-dev ffmpeg cmake xmlsec1 unzip

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.4.0

      - name: Setup grok
        env:
          GROK_TAG: v20.4.0
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          xmllint --version
          xmlsec1 --version
          grk_compress -h > /dev/null

      - name: Cache ISDCF reference content
        uses: actions/cache@v4
        with:
          path: tests/isdcf
          key: isdcf-${{ runner.os }}-v1-${{ hashFiles('scripts/download_isdcf.sh') }}

      - name: Fetch ISDCF reference content
        run: ./scripts/download_isdcf.sh

      - name: Cache ClairMeta ECL set
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clairmeta-data
          key: clairmeta-${{ runner.os }}-v1-${{ hashFiles('scripts/download_clairmeta_data.sh') }}

      - name: Fetch ClairMeta ECL set
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: ./scripts/download_clairmeta_data.sh

      - name: Build dcpdoctor
        working-directory: dcpdoctor/rust
        run: cargo build --release --locked

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Create synthetic fixtures
        run: ./scripts/create_synthetic.sh

      # generate.sh needs a source with video and audio so dcpwizard emits both MXFs
      - name: Generate DCP fixtures
        run: |
          ffmpeg -y -f lavfi -i testsrc2=size=2048x1080:rate=24:duration=3 \
                 -f lavfi -i sine=frequency=1000:sample_rate=48000:duration=3 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/ctp-source.mp4
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          SOURCE_VIDEO=/tmp/ctp-source.mp4 ./scripts/generate.sh

      # Runs every category, including the isdcf cases.
      - name: Test packages
        run: |
          DCPDOCTOR="$PWD/dcpdoctor/rust/target/release/dcpdoctor"
          ./scripts/run_tests.sh --dcpdoctor "$DCPDOCTOR"

      # Per-error-code negative corpus: one real mutated fixture per code, each
      # asserting its code fires and is absent on the valid baseline. The last
      # step of build_corpus.sh records the ClairMeta reference-package verdicts.
      - name: Build per-code corpus
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/build_corpus.sh

      - name: Run per-code corpus assertions
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: |
          DCPDOCTOR="$PWD/dcpdoctor/rust/target/release/dcpdoctor" \
          python3 ./scripts/run_corpus.py

      # Cross-tool signature survey: dcpdoctor and xmlsec1 must agree on every
      # signed document both can render a verdict on. A disagreement is a
      # verifier defect in one of the two, so this gates.
      - name: Signature survey vs xmlsec1
        run: |
          DCPDOCTOR="$PWD/dcpdoctor/rust/target/release/dcpdoctor" \
          python3 ./scripts/signature_survey.py corpus dcpdoctor/tests

  # Optional crypto job: prove dcpwizard's encryption + KDM chain end to end.
  # Encrypt a DCP, build a KDM for a recipient we control, independently
  # RSA-unwrap the content key from the KDM (openssl) and decrypt the essence
  # (asdcplib-rs). Independent of core CI; a break here fails only this job.
  encryption:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxml2-utils libssl-dev libxerces-c-dev ffmpeg cmake xmlsec1

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.4.0

      - name: Setup grok
        env:
          GROK_TAG: v20.4.0
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          xmllint --version
          xmlsec1 --version
          grk_compress -h > /dev/null

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Verify encryption + KDM chain
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/verify_encryption.sh

  # Optional differential job: diff dcpdoctor against ClairMeta over the corpus.
  # Informational, never blocks core CI (uploads report.json + report.md).
  # Baselines, fixtures and the ClairMeta ECL packages all run. asdcplib is
  # absent so ClairMeta's MXF-essence checks bypass.
  # Photon/IMF isn't run: the corpus has no IMF packages.
  differential:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpdoctor
          path: dcpdoctor
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: PostPerfection/dcpwizard
          path: dcpwizard
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev libxml2-utils libssl-dev libxerces-c-dev ffmpeg cmake xmlsec1
          curl -LsSf https://astral.sh/uv/install.sh | sh

      # build grok (jpeg 2000 codec) from source once per tag, cached.
      # provides libgrokj2k on the pkg-config + loader paths and grk_compress on PATH.
      - name: Cache grok
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/grok-install
          key: grok-${{ runner.os }}-v20.4.0

      - name: Setup grok
        env:
          GROK_TAG: v20.4.0
        run: |
          prefix="$GITHUB_WORKSPACE/grok-install"
          if [ ! -x "$prefix/bin/grk_compress" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$GROK_TAG" \
              https://github.com/GrokImageCompression/grok.git "$RUNNER_TEMP/grok-src"
            cmake -S "$RUNNER_TEMP/grok-src" -B "$RUNNER_TEMP/grok-build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$RUNNER_TEMP/grok-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/grok-build"
          fi
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          xmllint --version
          xmlsec1 --version
          grk_compress -h > /dev/null

      - name: Cache ClairMeta ECL set
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clairmeta-data
          key: clairmeta-${{ runner.os }}-v1-${{ hashFiles('scripts/download_clairmeta_data.sh') }}

      - name: Fetch ClairMeta ECL set
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: ./scripts/download_clairmeta_data.sh

      - name: Build dcpdoctor
        working-directory: dcpdoctor/rust
        run: cargo build --release --locked

      - name: Build dcpwizard
        working-directory: dcpwizard/rust
        run: cargo build --release --locked

      - name: Build per-code corpus
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: |
          DCPWIZARD="$PWD/dcpwizard/rust/target/release/dcpwizard" \
          ./scripts/build_corpus.sh

      - name: Run differential harness
        working-directory: diff
        env:
          CLAIRMETA_DATA: ${{ github.workspace }}/clairmeta-data
        run: |
          DCPDOCTOR="$GITHUB_WORKSPACE/dcpdoctor/rust/target/release/dcpdoctor" \
          uv run differential.py

      - uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            diff/report.json
            diff/report.md
